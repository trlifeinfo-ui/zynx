<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#07090e"
    >

    <meta
        name="description"
        content="ZYNX — Discord Security, Ticket, Voice, AI ve Analyzer yönetim platformu."
    >

    <title>
        ZYNX — Discord Automation Platform
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================================================
           ZYNX DESIGN SYSTEM
        ========================================================= */

        :root {

            --bg:
                #07090e;

            --bg-secondary:
                #0b0e15;

            --bg-tertiary:
                #10141d;

            --panel:
                rgba(255,255,255,.035);

            --panel-hover:
                rgba(255,255,255,.055);

            --panel-strong:
                rgba(255,255,255,.075);

            --border:
                rgba(255,255,255,.075);

            --border-strong:
                rgba(255,255,255,.14);

            --text:
                #f6f7fb;

            --text-secondary:
                #d9deea;

            --muted:
                #929bab;

            --muted-2:
                #687181;

            --primary:
                #765cff;

            --primary-strong:
                #6145e9;

            --primary-soft:
                rgba(118,92,255,.13);

            --success:
                #38d39f;

            --warning:
                #f6c85f;

            --danger:
                #fb7185;

            --info:
                #67b9ff;

            --radius-xs:
                9px;

            --radius-sm:
                12px;

            --radius-md:
                16px;

            --radius-lg:
                20px;

            --radius-xl:
                26px;

            --shadow:
                0 28px 90px rgba(0,0,0,.38);

            --header:
                78px;

            --max:
                1480px;

            --sidebar:
                255px;
        }


        /* =========================================================
           RESET
        ========================================================= */

        * {

            box-sizing:
                border-box;

            margin:
                0;

            padding:
                0;
        }


        html {

            scroll-behavior:
                smooth;
        }


        body {

            min-height:
                100vh;

            overflow-x:
                hidden;

            background:

                radial-gradient(
                    circle at 5% -5%,
                    rgba(118,92,255,.15),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 95% 5%,
                    rgba(53,140,255,.08),
                    transparent 28%
                ),

                var(--bg);

            color:
                var(--text);

            font-family:
                "Inter",
                system-ui,
                sans-serif;

            font-size:
                15px;

            line-height:
                1.55;
        }


        body::before {

            content:
                "";

            position:
                fixed;

            inset:
                0;

            pointer-events:
                none;

            z-index:
                -1;

            opacity:
                .65;

            background-image:

                linear-gradient(
                    rgba(255,255,255,.012) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,.012) 1px,
                    transparent 1px
                );

            background-size:
                42px 42px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent 90%
                );
        }


        button,
        input,
        textarea,
        select {

            font:
                inherit;
        }


        button {

            cursor:
                pointer;

            border:
                0;
        }


        a {

            text-decoration:
                none;

            color:
                inherit;
        }


        img {

            display:
                block;

            max-width:
                100%;
        }


        ::selection {

            background:
                rgba(118,92,255,.35);

            color:
                white;
        }


        .hidden {

            display:
                none !important;
        }


        /* =========================================================
           BOOT SCREEN
        ========================================================= */

        .boot-screen {

            position:
                fixed;

            inset:
                0;

            z-index:
                999999;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                #07090e;

            transition:
                opacity .35s ease,
                visibility .35s ease;
        }


        .boot-screen.done {

            opacity:
                0;

            visibility:
                hidden;
        }


        .boot-card {

            text-align:
                center;
        }


        .boot-logo {

            width:
                72px;

            height:
                72px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            margin:
                0 auto 17px;

            border-radius:
                22px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary-strong)
                );

            box-shadow:
                0 20px 65px rgba(118,92,255,.35);

            color:
                white;

            font-size:
                25px;

            font-weight:
                900;
        }


        .boot-title {

            font-size:
                17px;

            font-weight:
                900;
        }


        .boot-text {

            margin-top:
                4px;

            color:
                var(--muted);

            font-size:
                12px;
        }


        .boot-spinner {

            width:
                26px;

            height:
                26px;

            margin:
                18px auto 0;

            border:
                3px solid rgba(255,255,255,.08);

            border-top-color:
                var(--primary);

            border-radius:
                50%;

            animation:
                spin .8s linear infinite;
        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);
            }
        }


        /* =========================================================
           TOPBAR
        ========================================================= */

        .topbar {

            position:
                fixed;

            top:
                0;

            left:
                0;

            right:
                0;

            height:
                var(--header);

            z-index:
                8000;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            padding:
                0 30px;

            border-bottom:
                1px solid var(--border);

            background:
                rgba(7,9,14,.82);

            backdrop-filter:
                blur(22px);
        }


        .brand {

            display:
                flex;

            align-items:
                center;

            gap:
                12px;

            cursor:
                pointer;

            user-select:
                none;
        }


        .brand-logo {

            width:
                43px;

            height:
                43px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                13px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary-strong)
                );

            box-shadow:
                0 10px 30px rgba(118,92,255,.24);

            font-size:
                16px;

            font-weight:
                900;
        }


        .brand-name {

            font-size:
                17px;

            font-weight:
                900;

            letter-spacing:
                -.025em;
        }


        .brand-caption {

            margin-top:
                1px;

            color:
                var(--muted);

            font-size:
                10px;
        }


        .top-navigation {

            display:
                flex;

            align-items:
                center;

            gap:
                4px;
        }


        .nav-button {

            min-height:
                40px;

            padding:
                0 12px;

            border:
                1px solid transparent;

            border-radius:
                10px;

            background:
                transparent;

            color:
                var(--muted);

            font-size:
                13px;

            font-weight:
                700;

            transition:
                .2s ease;
        }


        .nav-button:hover {

            color:
                var(--text);

            background:
                rgba(255,255,255,.04);
        }


        .nav-button.active {

            color:
                white;

            background:
                var(--primary-soft);

            border-color:
                rgba(118,92,255,.14);
        }


        .top-right {

            display:
                flex;

            align-items:
                center;

            gap:
                9px;
        }


        .support-button {

            min-height:
                40px;

            display:
                inline-flex;

            align-items:
                center;

            gap:
                8px;

            padding:
                0 11px;

            border:
                1px solid var(--border);

            border-radius:
                11px;

            background:
                rgba(255,255,255,.03);

            color:
                var(--muted);

            font-size:
                12px;

            font-weight:
                800;

            transition:
                .2s;
        }


        .support-button:hover {

            color:
                white;

            background:
                rgba(255,255,255,.065);

            border-color:
                var(--border-strong);
        }


        .plus-beta-badge {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                6px;

            padding:
                7px 9px;

            border:
                1px solid rgba(118,92,255,.23);

            border-radius:
                9px;

            background:
                rgba(118,92,255,.08);

            color:
                #c8c0ff;

            font-size:
                9px;

            font-weight:
                900;

            letter-spacing:
                .03em;
        }


        .plus-beta-badge span {

            padding:
                2px 5px;

            border-radius:
                5px;

            background:
                rgba(118,92,255,.18);

            color:
                #d7d0ff;

            font-size:
                7px;
        }


        .login-button {

            min-height:
                42px;

            padding:
                0 16px;

            border-radius:
                12px;

            background:
                linear-gradient(
                    135deg,
                    #7d62ff,
                    #5c40e7
                );

            color:
                white;

            font-size:
                13px;

            font-weight:
                850;

            box-shadow:
                0 10px 30px rgba(118,92,255,.19);

            transition:
                .2s;
        }


        .login-button:hover {

            transform:
                translateY(-1px);

            filter:
                brightness(1.06);
        }


        .account-button {

            display:
                flex;

            align-items:
                center;

            gap:
                9px;

            min-height:
                48px;

            padding:
                5px 9px 5px 6px;

            border:
                1px solid var(--border);

            border-radius:
                14px;

            background:
                rgba(255,255,255,.035);

            color:
                white;

            transition:
                .2s;
        }


        .account-button:hover {

            background:
                rgba(255,255,255,.07);

            border-color:
                var(--border-strong);
        }


        .account-avatar {

            width:
                37px;

            height:
                37px;

            border-radius:
                11px;

            object-fit:
                cover;

            background:
                #1b2030;
        }


        .account-info {

            text-align:
                left;
        }


        .account-name {

            max-width:
                135px;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

            white-space:
                nowrap;

            font-size:
                12px;

            font-weight:
                850;
        }


        .account-plan {

            margin-top:
                1px;

            color:
                var(--muted);

            font-size:
                9px;
        }


        /* =========================================================
           MOBILE NAV
        ========================================================= */

        .mobile-menu-button {

            display:
                none;

            width:
                40px;

            height:
                40px;

            align-items:
                center;

            justify-content:
                center;

            border:
                1px solid var(--border);

            border-radius:
                11px;

            background:
                var(--panel);

            color:
                white;

            font-size:
                16px;
        }


        .mobile-menu {

            position:
                fixed;

            top:
                var(--header);

            left:
                0;

            right:
                0;

            z-index:
                7900;

            padding:
                12px;

            border-bottom:
                1px solid var(--border);

            background:
                rgba(7,9,14,.96);

            backdrop-filter:
                blur(20px);
        }


        .mobile-grid {

            display:
                grid;

            grid-template-columns:
                repeat(2,1fr);

            gap:
                6px;
        }


        /* =========================================================
           MAIN
        ========================================================= */

        .main {

            min-height:
                100vh;

            padding-top:
                var(--header);
        }


        .container {

            width:
                min(
                    var(--max),
                    calc(100% - 52px)
                );

            margin:
                0 auto;
        }


        .page {

            min-height:
                calc(
                    100vh -
                    var(--header)
                );

            padding:
                44px 0 80px;

            animation:
                pageEnter .28s ease;
        }


        @keyframes pageEnter {

            from {

                opacity:
                    0;

                transform:
                    translateY(7px);
            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0);
            }
        }


        /* =========================================================
           HERO
        ========================================================= */

        .hero {

            min-height:
                680px;

            display:
                grid;

            grid-template-columns:
                1.04fr .96fr;

            align-items:
                center;

            gap:
                65px;
        }


        .hero-badge {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                7px;

            padding:
                8px 10px;

            border:
                1px solid rgba(118,92,255,.18);

            border-radius:
                999px;

            background:
                rgba(118,92,255,.085);

            color:
                #c7c0ff;

            font-size:
                11px;

            font-weight:
                850;
        }


        .hero-badge-dot {

            width:
                7px;

            height:
                7px;

            border-radius:
                50%;

            background:
                var(--success);

            box-shadow:
                0 0 14px rgba(56,211,159,.65);
        }


        .hero-title {

            max-width:
                850px;

            margin-top:
                23px;

            font-size:
                clamp(
                    48px,
                    5.7vw,
                    80px
                );

            line-height:
                1.01;

            font-weight:
                900;

            letter-spacing:
                -.067em;
        }


        .hero-gradient {

            background:
                linear-gradient(
                    100deg,
                    #ffffff,
                    #c7c0ff 48%,
                    #765cff
                );

            -webkit-background-clip:
                text;

            background-clip:
                text;

            color:
                transparent;
        }


        .hero-description {

            max-width:
                700px;

            margin-top:
                25px;

            color:
                var(--muted);

            font-size:
                17px;

            line-height:
                1.82;
        }


        .hero-actions {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                11px;

            margin-top:
                29px;
        }


        .button {

            min-height:
                46px;

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                8px;

            padding:
                0 18px;

            border-radius:
                12px;

            font-size:
                13px;

            font-weight:
                800;

            transition:
                .2s;
        }


        .button-primary {

            background:
                linear-gradient(
                    135deg,
                    #7d61ff,
                    #5c3fe7
                );

            color:
                white;

            box-shadow:
                0 14px 35px rgba(118,92,255,.18);
        }


        .button-primary:hover {

            transform:
                translateY(-1px);

            filter:
                brightness(1.06);
        }


        .button-secondary {

            border:
                1px solid var(--border);

            background:
                var(--panel);

            color:
                var(--text-secondary);
        }


        .button-secondary:hover {

            background:
                var(--panel-hover);

            border-color:
                var(--border-strong);
        }


        .hero-stats {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                30px;

            margin-top:
                33px;
        }


        .hero-stat strong {

            display:
                block;

            font-size:
                19px;

            font-weight:
                900;
        }


        .hero-stat span {

            color:
                var(--muted);

            font-size:
                10px;
        }


        /* =========================================================
           PRODUCT PREVIEW
        ========================================================= */

        .product-preview {

            position:
                relative;

            padding:
                15px;

            overflow:
                hidden;

            border:
                1px solid var(--border);

            border-radius:
                27px;

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,.055),
                    rgba(255,255,255,.018)
                );

            box-shadow:
                var(--shadow);

            transform:
                perspective(1400px)
                rotateY(-2deg);
        }


        .preview-glow {

            position:
                absolute;

            right:
                -90px;

            top:
                -90px;

            width:
                270px;

            height:
                270px;

            border-radius:
                50%;

            background:
                rgba(118,92,255,.18);

            filter:
                blur(75px);

            pointer-events:
                none;
        }


        .preview-top {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            padding:
                3px 5px 13px;
        }


        .preview-dots {

            display:
                flex;

            gap:
                6px;
        }


        .preview-dots span {

            width:
                7px;

            height:
                7px;

            border-radius:
                50%;

            background:
                rgba(255,255,255,.13);
        }


        .preview-live {

            display:
                flex;

            align-items:
                center;

            gap:
                6px;

            color:
                var(--success);

            font-size:
                9px;

            font-weight:
                850;
        }


        .preview-live i {

            width:
                6px;

            height:
                6px;

            border-radius:
                50%;

            background:
                currentColor;
        }


        .preview-window {

            min-height:
                488px;

            display:
                grid;

            grid-template-columns:
                126px 1fr;

            overflow:
                hidden;

            border:
                1px solid var(--border);

            border-radius:
                20px;

            background:
                #090c12;
        }


        .preview-sidebar {

            padding:
                16px 9px;

            border-right:
                1px solid var(--border);
        }


        .preview-caption {

            margin:
                4px 8px 17px;

            color:
                var(--muted);

            font-size:
                8px;

            font-weight:
                900;

            text-transform:
                uppercase;
        }


        .preview-side {

            display:
                flex;

            align-items:
                center;

            gap:
                7px;

            min-height:
                31px;

            padding:
                0 9px;

            margin-bottom:
                4px;

            border-radius:
                8px;

            color:
                var(--muted);

            font-size:
                8px;

            font-weight:
                700;
        }


        .preview-side.active {

            color:
                white;

            background:
                rgba(118,92,255,.13);
        }


        .preview-content {

            padding:
                18px;
        }


        .preview-heading {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            margin-bottom:
                17px;
        }


        .preview-heading strong {

            font-size:
                16px;

            font-weight:
                900;
        }


        .preview-avatar {

            width:
                29px;

            height:
                29px;

            border-radius:
                9px;

            background:
                linear-gradient(
                    135deg,
                    #7d63ff,
                    #36237f
                );
        }


        .preview-metrics {

            display:
                grid;

            grid-template-columns:
                repeat(3,1fr);

            gap:
                8px;
        }


        .preview-metric {

            padding:
                13px;

            border:
                1px solid var(--border);

            border-radius:
                13px;

            background:
                rgba(255,255,255,.024);
        }


        .preview-metric-label {

            color:
                var(--muted);

            font-size:
                8px;
        }


        .preview-metric-value {

            margin-top:
                3px;

            font-size:
                16px;

            font-weight:
                900;
        }


        .preview-services {

            display:
                grid;

            gap:
                7px;

            margin-top:
                12px;
        }


        .preview-service {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            padding:
                12px;

            border:
                1px solid var(--border);

            border-radius:
                12px;

            background:
                rgba(255,255,255,.02);
        }


        .preview-service-left {

            display:
                flex;

            align-items:
                center;

            gap:
                9px;
        }


        .preview-icon {

            width:
                30px;

            height:
                30px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                9px;

            background:
                rgba(118,92,255,.11);

            font-size:
                13px;
        }


        .preview-service strong {

            display:
                block;

            font-size:
                10px;
        }


        .preview-service small {

            display:
                block;

            margin-top:
                2px;

            color:
                var(--muted);

            font-size:
                8px;
        }


        .preview-status {

            color:
                var(--success);

            font-size:
                8px;

            font-weight:
                850;
        }


        /* =========================================================
           SECTION
        ========================================================= */

        .section {

            padding-top:
                82px;
        }


        .section-head {

            display:
                flex;

            align-items:
                flex-end;

            justify-content:
                space-between;

            gap:
                20px;

            margin-bottom:
                24px;
        }


        .section-kicker {

            color:
                #aaa0ff;

            font-size:
                10px;

            font-weight:
                900;

            letter-spacing:
                .14em;

            text-transform:
                uppercase;
        }


        .section-title {

            margin-top:
                6px;

            font-size:
                32px;

            line-height:
                1.12;

            font-weight:
                900;

            letter-spacing:
                -.045em;
        }


        .section-description {

            max-width:
                700px;

            margin-top:
                8px;

            color:
                var(--muted);

            font-size:

/* =============================================================
   BASIC HELPERS
============================================================= */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}


function escapeAttr(
    value
) {

    return escapeHTML(
        value
    );
}


function clean(
    value
) {

    return String(
        value ?? ""
    ).trim();
}


function initials(
    value
) {

    const text =
        clean(
            value
        );


    if (
        !text
    ) {

        return "Z";
    }


    return text
        .split(
            /\s+/
        )
        .slice(
            0,
            2
        )
        .map(
            item =>
                item
                    .charAt(0)
                    .toUpperCase()
        )
        .join("");
}


function safeURL(
    value
) {

    const input =
        clean(
            value
        );


    if (
        !input
    ) {

        return "#";
    }


    try {

        const url =
            new URL(
                input
            );


        if (
            ![
                "http:",
                "https:"
            ].includes(
                url.protocol
            )
        ) {

            return "#";
        }


        return url.href;

    } catch {

        return "#";
    }
}


function formatDate(
    date
) {

    if (
        !date
    ) {

        return "—";
    }


    const value =
        new Date(
            date
        );


    if (
        Number.isNaN(
            value.getTime()
        )
    ) {

        return "—";
    }


    return new Intl.DateTimeFormat(
        "tr-TR",
        {

            dateStyle:
                "medium"

        }
    ).format(
        value
    );
}


function formatDateTime(
    date
) {

    if (
        !date
    ) {

        return "—";
    }


    const value =
        new Date(
            date
        );


    if (
        Number.isNaN(
            value.getTime()
        )
    ) {

        return "—";
    }


    return new Intl.DateTimeFormat(
        "tr-TR",
        {

            dateStyle:
                "medium",

            timeStyle:
                "short"

        }
    ).format(
        value
    );
}


function formatRemaining(
    date
) {

    if (
        !date
    ) {

        return "—";
    }


    const end =
        new Date(
            date
        ).getTime();


    if (
        Number.isNaN(
            end
        )
    ) {

        return "—";
    }


    const diff =
        end -
        Date.now();


    if (
        diff <=
        0
    ) {

        return "Süresi doldu";
    }


    const days =
        Math.floor(
            diff /
            86400000
        );


    const hours =
        Math.floor(
            (
                diff %
                86400000
            ) /
            3600000
        );


    if (
        days > 0
    ) {

        return `${days} gün ${hours} saat`;
    }


    const minutes =
        Math.floor(
            (
                diff %
                3600000
            ) /
            60000
        );


    return `${hours} saat ${minutes} dakika`;
}

/* =============================================================
   TOAST
============================================================= */

function toast(
    title,
    message,
    type = "success"
) {

    const stack =
        document.getElementById(
            "toastStack"
        );


    if (
        !stack
    ) {

        return;
    }


    const item =
        document.createElement(
            "div"
        );


    item.className =
        `toast ${type}`;


    item.innerHTML = `

        <div class="toast-title">

            ${escapeHTML(title)}

        </div>

        <div class="toast-message">

            ${escapeHTML(message)}

        </div>

    `;


    stack.appendChild(
        item
    );


    setTimeout(
        () => {

            item.style.opacity =
                "0";

            item.style.transform =
                "translateY(8px)";


            setTimeout(
                () =>
                    item.remove(),
                250
            );

        },
        4200
    );
}


/* =============================================================
   API
============================================================= */

async function api(
    path,
    options = {}
) {

    const {

        timeout = 15000,

        ...fetchOptions

    } = options;


    const controller =
        new AbortController();


    const timer =
        setTimeout(
            () =>
                controller.abort(),
            timeout
        );


    try {

        const response =
            await fetch(

                `${ZYNX_CONFIG.API_URL}${path}`,

                {

                    ...fetchOptions,

                    credentials:
                        "include",

                    headers: {

                        Accept:
                            "application/json",

                        ...(fetchOptions.body
                            ? {

                                "Content-Type":
                                    "application/json"

                            }
                            : {}),

                        ...(fetchOptions.headers ||
                            {})

                    },

                    signal:
                        controller.signal
                }

            );


        const raw =
            await response.text();


        let data;


        try {

            data =
                raw
                    ? JSON.parse(
                        raw
                    )
                    : null;

        } catch {

            data = {

                success:
                    false,

                message:
                    raw ||
                    "Sunucudan geçersiz veri geldi."

            };
        }


        if (
            !response.ok
        ) {

            const error =
                new Error(

                    data?.message ||
                    `HTTP ${response.status}`

                );


            error.status =
                response.status;


            error.data =
                data;


            throw error;
        }


        return data;

    } catch (error) {

        if (
            error?.name ===
            "AbortError"
        ) {

            throw new Error(
                "Sunucu isteği zaman aşımına uğradı."
            );
        }


        throw error;

    } finally {

        clearTimeout(
            timer
        );
    }
}

/* =============================================================
   ROUTING
============================================================= */

function navigate(
    page
) {

    if (
        !ROUTES.includes(
            page
        )
    ) {

        page =
            "home";
    }


    const protectedPages = [

        "dashboard",
        "servers",
        "server",
        "subscription",
        "profile",
        "support",
        "checkout"

    ];


    if (
        protectedPages.includes(
            page
        ) &&
        !state.authenticated
    ) {

        toast(
            "Giriş gerekli",
            "Bu bölümü kullanmak için Discord ile giriş yapmalısınız."
        );


        login();

        return;
    }


    state.currentPage =
        page;


    state.mobileMenu =
        false;


    history.pushState(
        {},
        "",
        `#${page}`
    );


    render();
}


function readRoute() {

    const hash =
        window.location.hash
            .replace(
                "#",
                ""
            )
            .trim();


    if (
        hash ===
        "server"
    ) {

        state.currentPage =
            "server";

        return;
    }


    if (
        ROUTES.includes(
            hash
        )
    ) {

        state.currentPage =
            hash;

        return;
    }


    state.currentPage =
        "home";
}

function processOAuthCallback() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    if (
        params.get(
            "login"
        ) ===
        "success"
    ) {

        state.currentPage =
            "dashboard";


        history.replaceState(
            {},
            "",
            `${window.location.pathname}#dashboard`
        );


        setTimeout(
            () => {

                toast(
                    "Discord bağlantısı başarılı",
                    "ZYNX hesabınız başarıyla bağlandı."
                );

            },
            100
        );
    }


    if (
        params.get(
            "auth_error"
        )
    ) {

        const message =
            params.get(
                "auth_error"
            );


        history.replaceState(
            {},
            "",
            window.location.pathname
        );


        setTimeout(
            () => {

                toast(
                    "Discord girişi başarısız",
                    message,
                    "error"
                );

            },
            100
        );
    }
}

function serverChip(
    icon,
    label,
    stateValue
) {

    const connected =
        stateValue ===
        true;


    const pending =
        stateValue ===
        null ||
        typeof stateValue ===
        "undefined";


    return `

        <span
            class="
                server-chip
                ${
                    connected
                        ? "connected"
                        : pending
                            ? "pending"
                            : ""
                }
            "
        >

            ${icon}

            ${label}

            ${
                connected
                    ? "✓"
                    : pending
                        ? "•"
                        : "—"
            }

        </span>

    `;
}


function escapeJS(
    value
) {

    return String(
        value ?? ""
    )
        .replaceAll(
            "\\",
            "\\\\"
        )
        .replaceAll(
            "'",
            "\\'"
        )
        .replaceAll(
            "\n",
            "\\n"
        )
        .replaceAll(
            "\r",
            "\\r"
        );
}

async function openServer(
    guildId
) {

    state.selectedServer =
        guildId;


    state.selectedServerData =
        null;


    state.serverSection =
        "overview";


    try {

        const data =
            await api(
                `/api/servers/${encodeURIComponent(guildId)}`
            );


        if (
            data?.success
        ) {

            state.selectedServerData =
                data.server;
        }


    } catch (error) {

        console.error(
            error
        );


        toast(
            "Sunucu açılamadı",
            error.message ||
            "Sunucu bilgileri alınamadı.",
            "error"
        );


        return;
    }


    state.currentPage =
        "server";


    history.pushState(
        {},
        "",
        "#server"
    );


    render();
}

        !text

        toast(
            "Duyuru boş",
            "Önce bir duyuru metni yazın.",
            "error"
        );

        return;
    }


    if (
        isPlus()
    ) {

        togglePlusAI();


        setTimeout(
            () => {

                addPlusMessage(
                    `Şu duyuruyu daha profesyonel hale getirmeni istiyorum:\n\n${text}`
                );

            },
            100
        );


        return;
    }


    toast(
        "Duyuru hazırlandı",
        "Duyuru metni hazır. Gerçek Discord gönderimi bot gateway bağlantısından sonra aktif olacak."
    );
}

async function runAnalyzer(
    guildId
) {

    const resultBox =
        document.getElementById(
            "analysisResult"
        );


    if (
        resultBox
    ) {

        resultBox.innerHTML = `

            <div class="panel">

                Analyzer çalıştırılıyor...

            </div>

        `;
    }


    try {

        const data =
            await api(
                "/api/analyzer/run",
                {

                    method:
                        "POST",

                    body:
                        JSON.stringify({
                            guildId
                        })

                }
            );


        if (
            resultBox
        ) {

            resultBox.innerHTML =
                renderAnalyzerResult(
                    data.result
                );

async function saveProfile() {

    const input =
        document.getElementById(
            "profileDisplayName"
        );


    const displayName =
        clean(
            input?.value
        );


    try {

        const data =
            await api(
                "/api/profile",
                {

                    method:
                        "PATCH",

                    body:
                        JSON.stringify({
                            displayName
                        })

                }
            );


        if (
            data?.profile
        ) {

            state.profile =
                {

                    ...(state.profile || {}),

                    ...data.profile
                };
        }


        toast(
            "Profil güncellendi",
            "ZYNX profiliniz kaydedildi."
        );


        render();

    } catch (error) {

        toast(
            "Profil kaydedilemedi",
            error.message ||
            "Bir hata oluştu.",
            "error"
        );
    }
}

function subscriptionStatus(
    sub
) {

    if (
        sub.status ===
        "trialing"
    ) {

        return "Deneme";
    }


    if (
        sub.status ===
        "active"
    ) {

        return sub.cancelAtPeriodEnd
            ? "Dönem sonunda iptal"
            : "Aktif";
    }


    return "FREE";
}


async function cancelSubscription() {

    if (
        !window.confirm(
            "Abonelik durumunu değiştirmek istediğinize emin misiniz?"
        )
    ) {

        return;
    }


    try {

        const data =
            await api(
                "/api/subscription/cancel",
                {

                    method:
                        "POST"

                }
            );


        if (
            data?.subscription
        ) {

            state.subscription =
                data.subscription;
        }


        toast(
            "Abonelik güncellendi",
            data?.message ||
            "Abonelik durumu güncellendi."
        );


        render();

    } catch (error) {

        toast(
            "İşlem başarısız",
            error.message ||
            "Abonelik güncellenemedi.",
            "error"
        );
    }
}

                    body:
                        JSON.stringify({
                            category:

        if (
            data?.session

            const category =
                state.supportCategories.find(

                category ||

            state.supportSession =
                data.session;


            state.supportResult =

            render();

        toast(

    try {

        const data =
            await api(
                "/api/support/answer",
                {

                    method:
                        "POST",

                    body:
                        JSON.stringify({

                            sessionId:
                                state.supportSession.id,

                            answer

            );

function renderStatusRow(
    service
) {

    const info =
        service[3] ||

    const statusValue =
        info.status ||
        "pending";


    let type =
        "pending";


    if (
        statusValue ===
        "online"
    ) {

        type =
            "online";
    }


    if (
        statusValue ===
        "offline"
    ) {

        type =
            "offline";
    }


    if (
        statusValue ===
        "beta" ||
        statusValue ===
        "plus_only"
    ) {

        type =
            "beta";
    }


    return `

        <div class="status-row">

            <div class="status-left">

                <div class="status-icon">
                    ${escapeHTML(
                        service[0]

                <div>

            </div>


            <div

async function selectPlan(
    plan
) {

    plan =
        String(
            plan ||
            ""
        ).toUpperCase();


    if (
        ![
            "PRO",
            "PLUS"
        ].includes(
            plan
        )
    ) {

        navigate(
            "dashboard"
        );

        return;
    }


    state.selectedPlan =
        plan;


    if (
        !state.authenticated
    ) {

        login();

        return;
    }


    if (
        state.subscription?.plan ===
            plan &&
        subscriptionActive()
    ) {

        navigate(
            "subscription"
        );

        return;
    }


    try {

        const data =
            await api(
                "/api/checkout/create",
                {

                    method:
                        "POST",

                    body:
                        JSON.stringify({
                            plan
                        })

                }
            );


        if (
            data?.success
        ) {

            navigate(
                "checkout"
            );

        }

    } catch (error) {

        /*
            Backend plan already active.
        */

        if (
            error?.data?.subscription
        ) {

            state.subscription =
                error.data.subscription;

            navigate(
                "subscription"
            );


            return;
        }


        toast(
            "Plan seçilemedi",
            error.message ||
            "Checkout oluşturulamadı.",
            "error"
        );
    }
}

    `;
}


function formatAIText(
    text
) {

    return escapeHTML(
        text
    )
        .replaceAll(
            "\n",
            "<br>"
        );
}


function handleAIKeydown(
    event
) {

    if (
        event.key ===
            "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendPlusAI();
    }
}


function addPlusMessage(
    text
) {

    if (
        !isPlus()
    ) {

        return;
    }


    state.plusMessages.push({

        role:
            "user",

        text

    });


    if (
        !state.plusAI
    ) {

        state.plusAI =
            true;
    }


    render();


    sendPlusAIRequest(
        text
    );
}


async function sendPlusAI() {

    const input =
        document.getElementById(
            "plusAIInput"
        );


    const text =
        clean(
            input?.value
        );


    if (
        !text ||
        state.plusSending
    ) {

        return;
    }


    state.plusMessages.push({

        role:
            "user",

        text
    });


    state.plusSending =
        true;


    render();


    await sendPlusAIRequest(
        text
    );
}


async function sendPlusAIRequest(
    text
) {

    try {

        const data =
            await api(
                "/api/plus/ai/chat",
                {

                    method:
                        "POST",

                    body:
                        JSON.stringify({

                            message:
                                text,

                            guildId:
                                state.selectedServerData?.id ||
                                null,

                            context: {

                                currentPage:
                                    state.currentPage,

                                currentServer:
                                    state.selectedServerData
                                        ? {

                                            id:
                                                state.selectedServerData.id,

                                            name:
                                                state.selectedServerData.name

                                          }
                                        : null,

                                subscription:
                                    state.subscription

                            }

                        })

                }
            );


        const answer =
            data?.ai?.answer ||
            "İsteğini aldım fakat şu anda uygun bir cevap oluşturamadım.";


        state.plusMessages.push({

            role:
                "ai",

            text:
                answer

        });


    } catch (error) {

        state.plusMessages.push({

            role:
                "ai",

            text:
                `İsteğini işlerken bir sorun oluştu: ${error.message}`

        });

    } finally {

        state.plusSending =
            false;


        render();


        setTimeout(
            () => {

                const messages =
                    document.getElementById(
                        "plusAIMessages"
                    );


                if (
                    messages
                ) {

                    messages.scrollTop =
                        messages.scrollHeight;
                }

            },
            50
        );
    }
}


/* =============================================================
   PROTECTED LAYOUT
============================================================= */

function protectedLayout(
    content
) {

    return `

        <div class="page">

            <div class="container">

                <div class="dashboard-layout">

                    ${renderSidebar()}

                    <main class="content">

                        ${content}

                    </main>

                </div>

            </div>

        </div>

    `;
}


/* =============================================================
   BOT PAGE
============================================================= */

function renderBotsPage() {

    const bots =
        state.bots.length
            ? state.bots
            : fallbackBots();


    return `

        <div class="page">

            <div class="container">

                <div class="content-header">

                    <div>

                        <div class="content-title">
                            ZYNX Sistemleri
                        </div>

                        <div class="content-subtitle">
                            ZYNX'in tüm sistemlerini inceleyin.
                        </div>

                    </div>

                </div>


                <div class="bot-grid">

                    ${bots.map(
                        bot =>
                            renderBotCard(
                                bot
                            )
                    ).join("")}

                </div>


                <section
                    class="panel"
                    style="margin-top:17px"
                >

                    <div class="panel-title">
                        ZYNX PLUS
                    </div>

                    <div class="panel-description">

                        PLUS üyeleri için sağ altta
                        sürekli erişilebilir ZYNX PLUS AI
                        asistanı bulunur. Sunucu bağlamını
                        anlayarak daha uygun cevaplar üretmek
                        üzere tasarlanmıştır.

                    </div>

                </section>

            </div>

        </div>

    `;
}


/* =============================================================
   SUPPORT / SERVER REFRESH
============================================================= */

async function refreshServers() {

    try {

        toast(
            "Sunucular yenileniyor",
            "Discord hesabındaki sahiplik bilgileri güncelleniyor."
        );


        await loadServers();


        render();


        toast(
            "Sunucular güncellendi",
            `${state.servers.length} sahip olduğun sunucu bulundu.`
        );

    } catch (error) {

        toast(
            "Sunucular alınamadı",
            error.message ||
            "Bir hata oluştu.",
            "error"
        );
    }
}


async function refreshAccount() {

    if (
        state.refreshLoading
    ) {

        return;
    }


    state.refreshLoading =
        true;


    try {

        await loadSession();


        if (
            state.authenticated
        ) {

            await loadAccountData();
        }


        render();


        toast(
            "Panel yenilendi",
            "Hesap ve sunucu bilgileri güncellendi."
        );

    } catch (error) {

        toast(
            "Yenileme başarısız",
            error.message ||
            "Veriler güncellenemedi.",
            "error"
        );

    } finally {

        state.refreshLoading =
            false;
    }
}


/* =============================================================
   PAGE ROUTER
============================================================= */

function pageContent() {

    switch (
        state.currentPage
    ) {

        case "home":
            return renderHome();

        case "bots":
            return renderBotsPage();

        case "commands":
            return renderCommandsPage();

        case "premium":
            return renderPremiumPage();

        case "status":
            return renderStatusPage();

        case "dashboard":
            return renderDashboard();

        case "servers":
            return renderServersPage();

        case "server":
            return renderServerPage();

        case "subscription":
            return renderSubscriptionPage();

        case "profile":
            return renderProfilePage();

        case "support":
            return renderSupportPage();

        case "analyzer":
            return renderAnalyzerPage();

        case "checkout":
            return renderCheckoutPage();

        default:
            return renderHome();
    }
}


/* =============================================================
   MAIN RENDER
============================================================= */

function render() {

    const app =
        document.getElementById(
            "app"
        );


    if (
        !app
    ) {

        return;
    }


    app.innerHTML = `

        ${renderNavbar()}

        <main class="main">

            ${pageContent()}

            ${renderFooter()}

        </main>


        ${renderPlusAI()}

    `;

}


function renderFooter() {

    return `

        <div class="container">

            <footer class="footer">

                <div class="footer-inner">

                    <div>

                        <span class="studio-brand">
                            TR LIFE STUDIOS
                        </span>

                        • Creator & Developer of ZYNX

                    </div>


                    <div>

                        ZYNX v${ZYNX_CONFIG.VERSION}

                    </div>

                </div>

            </footer>

        </div>

    `;
}


/* =============================================================
   INITIALIZATION
============================================================= */

async function init() {

    try {

        readRoute();

        processOAuthCallback();

        await loadPublicData();

        await loadSession();

        if (
            state.authenticated
        ) {

            await loadAccountData();

        }


        await loadSupportCategories();

    } catch (error) {

        console.error(
            "ZYNX INIT:",
            error
        );

        toast(
            "Başlatma hatası",
            error.message ||
            "ZYNX yüklenirken bir hata oluştu.",
            "error"
        );

    } finally {

        state.loading =
            false;


        render();


        const boot =
            document.getElementById(
                "bootScreen"
            );


        if (
            boot
        ) {

            requestAnimationFrame(
                () => {

                    boot.classList.add(
                        "done"
                    );


                    setTimeout(
                        () =>
                            boot.remove(),
                        450
                    );

                }
            );
        }

    }
}


/* =============================================================
   BROWSER EVENTS
============================================================= */

window.addEventListener(
    "popstate",
    () => {

        readRoute();

        render();

    }
);


window.addEventListener(
    "hashchange",
    () => {

        readRoute();

        render();

    }
);


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
                "Escape" &&
            state.plusAI
        ) {

            state.plusAI =
                false;

            render();

        }

    }
);


/* =============================================================
   START
============================================================= */

init();


</script>
